name: Build and Release on Tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requires.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --clean --noconfirm game.spec

      - name: Find built exe
        id: find_exe
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe found in dist"; exit 1 }
          Write-Host "Found $($exe.FullName)"
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-exe
          path: ${{ steps.find_exe.outputs.exe_path }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Release created by workflow
          draft: false
          prerelease: false

      - name: Upload EXE to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_exe.outputs.exe_path }}
          asset_name: ${{ github.repository }}-${{ github.ref_name }}.exe
          asset_content_type: application/octet-stream

      - name: Update release with download link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = "${{ steps.create_release.outputs.id }}"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ github.repository }}-${{ github.ref_name }}.exe"
          $encoded = [System.Uri]::EscapeDataString($downloadUrl)
          $body = "Download at Tapri: [download](https://release.tapri.dev?download_url=$encoded)"
          $payload = @{ body = $body } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}" -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "github-actions" } -ContentType 'application/json' -Body $payload
